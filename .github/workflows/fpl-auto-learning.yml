name: FPL Auto Learning Log

on:
  workflow_dispatch:
  schedule:
    # Run every 15 minutes. One snapshot is saved in the six hours before each deadline.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: fpl-data-branch-updates
  cancel-in-progress: false

jobs:
  update-forecasts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out dashboard code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check numpy requests pandas

      - name: Run engine validation tests
        run: python -m unittest discover -s tests -v

      - name: Prepare persistent forecast branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          DATA_DIR="$RUNNER_TEMP/fpl-data"
          if git ls-remote --exit-code --heads "$REMOTE_URL" fpl-data >/dev/null 2>&1; then
            git clone --depth 1 --single-branch --branch fpl-data "$REMOTE_URL" "$DATA_DIR"
          else
            mkdir -p "$DATA_DIR"
            git -C "$DATA_DIR" init -b fpl-data
            git -C "$DATA_DIR" config user.name 'github-actions[bot]'
            git -C "$DATA_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            printf '%s\n' 'season,gameweek,player_id,player,position,club,model_version,forecast_created_utc,projection_model,projection_baseline,projection_ep_next,projection_model_5gw,projection_baseline_5gw,forecast_horizon_gws,history_enriched,history_sample_matches,projection_expected_minutes,xi_eligible,model_captain_pick,actual_points,actual_minutes,actual_points_5gw,actual_minutes_5gw' > "$DATA_DIR/forecast_log.csv"
            git -C "$DATA_DIR" add forecast_log.csv
            git -C "$DATA_DIR" commit -m 'Initialize persistent FPL forecast log'
            git -C "$DATA_DIR" remote add origin "$REMOTE_URL"
            git -C "$DATA_DIR" push -u origin fpl-data
          fi
          echo "FPL_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

      - name: Snapshot forecasts and reconcile actual scores
        env:
          FPL_TEAM_ID: '2311669'
        run: python fpl_background_worker.py --csv-path "$FPL_DATA_DIR/forecast_log.csv"

      - name: Persist log updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$FPL_DATA_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forecast_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update FPL forecasts and actual scores [skip ci]"
            git push origin HEAD:fpl-data
          else
            echo 'Forecast log unchanged; nothing to commit.'
          fi
