name: Pull Request Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt numpy

      - name: Verify Streamlit AppTest is available
        run: python -c "import streamlit; import streamlit.testing.v1"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Check PR diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
