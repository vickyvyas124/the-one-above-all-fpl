name: Historical FPL Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-data-branch-updates
  cancel-in-progress: false

jobs:
  run-historical-backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out dashboard code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backtest dependencies
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Validate engine and metrics
        run: python -m unittest discover -s tests -v

      - name: Replay historical seasons using lagged-only features
        id: replay-historical
        continue-on-error: true
        run: python historical_backtest.py --out-dir "$RUNNER_TEMP/historical-output"

      - name: Persist historical backtest reports to fpl-data
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          DATA_DIR="$RUNNER_TEMP/fpl-data"
          if ! git ls-remote --exit-code --heads "$REMOTE_URL" fpl-data >/dev/null 2>&1; then
            echo 'The fpl-data branch does not exist yet. Run FPL Auto Learning Log once first.' >&2
            exit 1
          fi
          git clone --depth 1 --single-branch --branch fpl-data "$REMOTE_URL" "$DATA_DIR"
          cp "$RUNNER_TEMP/historical-output/historical_backtest_summary.csv" "$DATA_DIR/"
          cp "$RUNNER_TEMP/historical-output/historical_backtest_gameweeks.csv" "$DATA_DIR/"
          cp "$RUNNER_TEMP/historical-output/historical_backtest_metadata.json" "$DATA_DIR/"
          cd "$DATA_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical_backtest_summary.csv historical_backtest_gameweeks.csv historical_backtest_metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update historical FPL backtest results [skip ci]'
            git push origin HEAD:fpl-data
          else
            echo 'Historical reports unchanged; nothing to commit.'
          fi


      - name: Fail if any configured historical season was skipped
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/historical-output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata_path = Path(os.environ["REPORT_DIR"]) / "historical_backtest_metadata.json"
          if not metadata_path.exists():
              print(f"::error::Historical backtest metadata not found: {metadata_path}")
              sys.exit(1)
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          failures = metadata.get("failures", [])
          if failures:
              for item in failures:
                  print(f"::error title=Historical dataset failed::{item.get('season', 'unknown')}: {item.get('error', 'unknown error')}")
              print("::error::Backtest reports were saved where possible, but the full configured season set was not evaluated.")
              sys.exit(1)
          print("All configured historical seasons were evaluated successfully.")
          PY
